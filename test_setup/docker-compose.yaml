services:
  # Servidor web Django + uWSGI
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gutenberg_web
    ports:
      - "11111:11111"
      - "631:631"  # Puerto CUPS para administración
    volumes:
      - ./backend/production_settings.py:/app/backend/production_settings.py
      - ./data/media:/app/media
      - ./data/static:/app/static
      - /var/run/cups:/var/run/cups
      - /etc/cups:/etc/cups
    environment:
      - GUTENBERG_ENV=production
      - DJANGO_SETTINGS_MODULE=gutenberg.settings.production_settings
    depends_on:
      - db
      - redis
    networks:
      - gutenberg_network
    restart: unless-stopped
    command: web

  # Worker de Celery
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gutenberg_celery_worker
    volumes:
      - ./backend/production_settings.py:/app/backend/production_settings.py
      - ./data/media:/app/media
      - /var/run/cups:/var/run/cups
      - /etc/cups:/etc/cups
    environment:
      - GUTENBERG_ENV=production
      - DJANGO_SETTINGS_MODULE=gutenberg.settings.production_settings
    depends_on:
      - db
      - redis
      - web
    networks:
      - gutenberg_network
    restart: unless-stopped
    command: celery

  # Celery Beat (tareas programadas)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gutenberg_celery_beat
    volumes:
      - ./backend/production_settings.py:/app/backend/production_settings.py
    environment:
      - GUTENBERG_ENV=production
      - DJANGO_SETTINGS_MODULE=gutenberg.settings.production_settings
    depends_on:
      - db
      - redis
      - web
    networks:
      - gutenberg_network
    restart: unless-stopped
    command: beat

  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: gutenberg_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=gutenberg
      - POSTGRES_USER=gutenberg
      - POSTGRES_PASSWORD=gutenberg_password_change_me
    networks:
      - gutenberg_network
    restart: unless-stopped

  # Redis para Celery
  redis:
    image: redis:7-alpine
    container_name: gutenberg_redis
    networks:
      - gutenberg_network
    restart: unless-stopped

  # Nginx (opcional, para producción)
  nginx:
    image: nginx:alpine
    container_name: gutenberg_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/static:/var/www/static:ro
      - ./data/media:/var/www/media:ro
    depends_on:
      - web
    networks:
      - gutenberg_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  gutenberg_network:
    driver: bridge
