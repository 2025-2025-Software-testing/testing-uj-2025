services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: gutenberg-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=gutenberg
      - POSTGRES_USER=gutenberg
      - POSTGRES_PASSWORD=gutenberg_change_me_in_production
    networks:
      - gutenberg_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gutenberg"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis para Celery
  redis:
    image: redis:7-alpine
    container_name: gutenberg-redis
    networks:
      - gutenberg_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Servidor Django backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.simple
      args:
        GUTENBERG_USERNAME: gutenberg-docker
        GUTENBERG_UID: 659
        GUTENBERG_GID: 659
    container_name: gutenberg-backend
    ports:
      - "8000:8000"
      - "631:631"
    volumes:
      - ./backend/gutenberg/settings/docker_settings.py:/app/backend/gutenberg/settings/docker_settings.py
      - ./data/media:/app/media
      - ./data/static:/app/static
      - cups_data:/var/run/cups
    environment:
      - GUTENBERG_ENV=docker
      - DJANGO_SETTINGS_MODULE=gutenberg.settings.docker_settings
      - POSTGRES_PASSWORD=gutenberg_change_me_in_production
      - DJANGO_SECRET_KEY=change-this-to-a-random-secret-key-in-production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gutenberg_network
    restart: unless-stopped
    command: web

  # Worker de Celery
  celery:
    build:
      context: .
      dockerfile: Dockerfile.simple
      args:
        GUTENBERG_USERNAME: gutenberg-docker
        GUTENBERG_UID: 659
        GUTENBERG_GID: 659
    container_name: gutenberg-celery
    volumes:
      - ./backend/gutenberg/settings/docker_settings.py:/app/backend/gutenberg/settings/docker_settings.py
      - ./data/media:/app/media
      - cups_data:/var/run/cups
    environment:
      - GUTENBERG_ENV=docker
      - DJANGO_SETTINGS_MODULE=gutenberg.settings.docker_settings
      - POSTGRES_PASSWORD=gutenberg_change_me_in_production
      - DJANGO_SECRET_KEY=change-this-to-a-random-secret-key-in-production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - gutenberg_network
    restart: unless-stopped
    command: celery

  # Nginx proxy
  proxy:
    image: nginx:alpine
    container_name: gutenberg-proxy
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/static:/var/www/static:ro
      - ./data/media:/var/www/media:ro
    depends_on:
      - backend
    networks:
      - gutenberg_network
    restart: unless-stopped

volumes:
  postgres_data:
  cups_data:

networks:
  gutenberg_network:
    driver: bridge
